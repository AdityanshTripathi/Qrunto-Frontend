    <!-- Bar 6: 10pm -->
    <rect x="220" y="35" width="24" height="55" rx="5" fill="#EAE4DE"/>
    <text x="224" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#8C7E74">10p</text>
