    <!-- Bar 3: 4pm -->
    <rect x="94" y="60" width="24" height="30" rx="5" fill="#EAE4DE"/>
    <text x="100" y="106" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="500" fill="#8C7E74">4p</text>

    <!-- Bar 4: 6pm -->
    <rect x="136" y="30" width="24" height="60" rx="5" fill="#EAE4DE"/>
