<svg xmlns="http://www.w3.org/2000/svg" width="316" height="238" viewBox="0 0 316 238" fill="none">
  <rect width="316" height="238" rx="16" fill="#FFFFFF" fill-opacity="0.98"/>
  <rect x="0.5" y="0.5" width="315" height="237" rx="15.5" stroke="#EAE4DE"/>

  <!-- Header & Metric -->
  <g transform="translate(20, 20)">
    <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#786C62" letter-spacing="0.5">TODAY'S REVENUE</text>
    <rect x="180" y="-3" width="96" height="22" rx="11" fill="#ECFDF5"/>
    <text x="188" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#10B981">↑ +18.4% vs lw</text>

    <text x="0" y="44" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#1A1513">₹48,250.00</text>
    <text x="0" y="66" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#786C62">142 Dine-In &amp; Online Orders • ₹340 Avg</text>
  </g>

  <!-- Bar chart -->
  <g transform="translate(20, 110)">
