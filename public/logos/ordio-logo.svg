<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <!-- Fork icon -->
  <g>
    <!-- Tines -->
    <rect x="8" y="5" width="3" height="12" rx="1.5" fill="#C95A32"/>
    <rect x="13" y="5" width="3" height="12" rx="1.5" fill="#C95A32"/>
    <rect x="18" y="5" width="3" height="12" rx="1.5" fill="#C95A32"/>
    <!-- Neck curve (simplified as a rounded rect) -->
    <rect x="11.5" y="16" width="6" height="4" rx="2" fill="#C95A32"/>
    <!-- Handle -->
    <rect x="12.5" y="19" width="4" height="16" rx="2" fill="#C95A32"/>
  </g>
  <!-- Wordmark: ordio -->
  <text
    x="34"
    y="32"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#3A2118"
  >ord</text>
  <text
    x="99"
    y="32"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
    font-size="26"
    font-weight="800"
    letter-spacing="-0.5"
    fill="#C95A32"
  >io</text>
</svg>
